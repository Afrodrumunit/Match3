<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Gems Match 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hud">
      <h1>
        <svg class="logo-gem" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="gemBody" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#9be7ff"/>
              <stop offset="0.45" stop-color="#4fc3f7"/>
              <stop offset="1" stop-color="#7ab8ff"/>
            </linearGradient>
            <linearGradient id="gemFacet" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e3f7ff"/>
              <stop offset="1" stop-color="#7ad4ff"/>
            </linearGradient>
            <linearGradient id="gemShine" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/>
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="gemClip">
              <path d="M14 8 L50 8 L60 24 L32 58 L4 24 Z"/>
            </clipPath>
          </defs>
          <path d="M14 8 L50 8 L60 24 L32 58 L4 24 Z" fill="url(#gemBody)" stroke="#dff4ff" stroke-width="1.5" stroke-linejoin="round"/>
          <g clip-path="url(#gemClip)" stroke="#eafaff" stroke-width="1" opacity="0.85">
            <path d="M4 24 L60 24" fill="none"/>
            <path d="M14 8 L24 24 L32 58" fill="none"/>
            <path d="M50 8 L40 24 L32 58" fill="none"/>
            <path d="M24 24 L32 8 M40 24 L32 8" fill="none"/>
          </g>
          <path d="M14 8 L32 8 L24 24 L4 24 Z" fill="url(#gemFacet)" opacity="0.9"/>
          <g clip-path="url(#gemClip)">
            <rect class="gem-sheen" x="-20" y="0" width="14" height="64" fill="url(#gemShine)" transform="skewX(-18)">
              <animate attributeName="x" values="-20;70;-20" dur="3.2s" repeatCount="indefinite"/>
            </rect>
          </g>
        </svg>
        Gems
      </h1>
      <div class="stats">
        <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
        <div class="stat"><span class="label">Moves</span><span id="moves" class="value">30</span></div>
        <div class="stat"><span class="label">Level</span><span id="level" class="value">1</span></div>
        <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
      </div>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="controls">
        <button id="restart" type="button">New Game</button>
        <button id="sound" type="button" aria-label="Toggle sound">🔊</button>
      </div>
    </header>
    <div id="board" class="board" aria-label="Match 3 board"></div>
    <p id="message" class="message"></p>
    <div id="gameover" class="gameover hidden" hidden>
      <h2>Game Over</h2>
      <p class="final-score">Score: <span id="final-score">0</span></p>
      <p id="new-best" class="new-best hidden">🏆 New best!</p>
      <h3>Top scores</h3>
      <ol id="top3" class="top3"></ol>
      <button id="play-again" type="button">Play again</button>
    </div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
